name: Lab 12 quality checks and production deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab12-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check constructor calculations and invalid inputs
        run: node tests/constructor-check.cjs
      - name: Build and verify pages and resources
        env:
          SITE_URL: https://smazhena-kava-lab12.vercel.app
        run: |
          node server/build.cjs
          node tests/site-check.cjs
      - name: Mobile Lighthouse audit
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p audit-reports
          node tests/serve.cjs > /tmp/lab12-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5514/ > /dev/null; then break; fi
            sleep 1
          done
          npx --yes lighthouse@13.6.0 http://127.0.0.1:5514/ --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path=audit-reports/mobile --quiet
          node tests/lighthouse-check.cjs audit-reports/mobile.report.json
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lab12-lighthouse
          path: audit-reports/
          if-no-files-found: warn
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify deployment configuration
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Set VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Set VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Set VERCEL_PROJECT_ID"; exit 1; }
      - name: Install Vercel CLI
        run: npm install --global vercel@65.14.0
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy tested production artifacts
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
