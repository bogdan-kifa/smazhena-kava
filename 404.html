<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Сторінку не знайдено — Смажена Кава</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbf6f0;
        color: #2b1d14;
        font:
          18px/1.6 system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 580px);
      }
      .brand {
        font:
          600 22px Georgia,
          serif;
      }
      .code {
        color: #6b5a4c;
        letter-spacing: 0.1em;
      }
      h1 {
        font:
          600 clamp(32px, 6vw, 48px)/1.2 Georgia,
          serif;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-block: 28px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 10px 18px;
        border: 1px solid #4a2e1e;
        border-radius: 8px;
        color: #4a2e1e;
        text-decoration: none;
      }
      a:first-child {
        color: white;
        background: #4a2e1e;
      }
      a:focus-visible {
        outline: 3px solid #9b5f34;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Смажена Кава</p>
      <p class="code">404</p>
      <h1>Ця сторінка загубилася</h1>
      <p>
        Можливо, адресу змінено або в посиланні є помилка. Повернися на головну або обери каву в
        каталозі.
      </p>
      <nav aria-label="Повернення до сайту">
        <a data-page="index.html" href="/index.html">На головну</a>
        <a data-page="catalog.html" href="/catalog.html">До каталогу</a>
      </nav>
    </main>
    <script>
      const base = location.hostname.endsWith(".github.io") ? "/smazhena-kava/" : "/";
      document.querySelectorAll("[data-page]").forEach((link) => {
        link.href = base + link.dataset.page;
      });
    </script>
  </body>
</html>
