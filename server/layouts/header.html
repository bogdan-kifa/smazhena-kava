<header
      id="site-header"
      data-component="header"
      class="box-border border-0 border-b border-solid border-brand-border bg-brand-background px-4 py-4 font-sans text-brand-text md:px-8 xl:px-16 [&_*]:box-border"
    >
      <div
        class="relative mx-auto flex w-full max-w-site flex-wrap items-center justify-between gap-x-3 gap-y-0 md:flex-nowrap"
      >
        <a
          class="inline-flex min-h-11 shrink-0 items-center gap-2 rounded-lg font-heading text-base font-semibold leading-7 text-brand no-underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand narrow:gap-3 narrow:text-lg lg:text-xl xl:text-[22px]"
          href="index.html"
        >
          <img
            class="block h-auto w-12 shrink-0 rounded-xl bg-brand-background p-1 max-[359px]:w-10"
            src="assets/images/logo.svg"
            alt="Смажена Кава"
            loading="eager"
            decoding="async"
            width="254"
            height="274"
          />

          <span class="whitespace-nowrap" aria-hidden="true">Смажена Кава</span>
        </a>

        <!-- До md навігація міститься у нативному меню; від md показується цей рядок. -->

        <nav
          id="desktop-navigation"
          class="hidden min-w-0 flex-1 justify-center md:flex"
          aria-label="Основна навігація"
        >
          <ul class="m-0 flex list-none items-center gap-1 p-0 lg:gap-2" role="list">
            <li>
              <a
                class="flex min-h-11 items-center rounded-lg py-2 text-sm font-medium text-brand-text no-underline transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none md:px-2 lg:px-3"
                href="catalog.html"
                >Кава</a
              >
            </li>

            <li>
              <a
                class="flex min-h-11 items-center rounded-lg py-2 text-sm font-medium text-brand-text no-underline transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none md:px-2 lg:px-3"
                href="quiz.html"
                >Quiz-підбір</a
              >
            </li>

            <li>
              <a
                class="flex min-h-11 items-center rounded-lg py-2 text-sm font-medium text-brand-text no-underline transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none md:px-2 lg:px-3"
                href="about.html"
                >Про нас</a
              >
            </li>
          </ul>
        </nav>

        <div class="mr-14 flex shrink-0 items-center gap-2 md:mr-0 lg:gap-3">
          <a
            class="hidden min-h-11 min-w-11 items-center justify-center gap-2 rounded-lg px-2 text-sm text-brand-text no-underline transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none md:inline-flex"
            href="login.html"
            aria-label="Акаунт"
          >
            <svg
              class="h-4 w-4 shrink-0"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="8" r="3" />

              <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
            </svg>

            <span class="hidden xl:inline">Акаунт</span>
          </a>

          <!-- Кількість успадкована від демонстраційного кошика; динаміка буде пізніше. -->

          <a
            class="inline-flex min-h-11 min-w-11 items-center justify-center gap-1 rounded-lg text-brand-text no-underline transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none"
            href="cart.html"
            aria-label="Кошик, 2 товари"
          >
            <svg
              class="h-4 w-4 shrink-0"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M5 8h14l-1.5 12h-11L5 8Z" />

              <path d="M9 8V6a3 3 0 0 1 6 0v2" />
            </svg>

            <span
              class="inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-brand px-1 text-xs font-medium leading-5 text-brand-background"
              aria-hidden="true"
              >2</span
            >
          </a>

          <a
            class="hidden min-h-12 items-center justify-center gap-2 rounded-lg border border-solid border-brand bg-brand px-3 py-3 text-sm font-semibold leading-5 text-brand-background no-underline transition-colors hover:border-brand-hover hover:bg-brand-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand active:bg-brand-hover motion-reduce:transition-none md:inline-flex lg:px-5 lg:text-base lg:leading-5"
            href="constructor.html"
            >Створити мікс

            <svg
              class="h-4 w-4 shrink-0"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M5 12h14m-6-6 6 6-6 6" /></svg
          ></a>
        </div>

        <!-- details/summary керує відкриттям без JavaScript; від md весь компонент приховано. -->

        <details class="group basis-full md:hidden">
          <summary
            class="absolute right-0 top-0 flex h-11 w-11 cursor-pointer list-none items-center justify-center rounded-lg border border-solid border-brand-border bg-transparent text-brand transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none narrow:top-1 [&::-webkit-details-marker]:hidden"
            aria-controls="mobile-navigation"
          >
            <span class="sr-only">Меню навігації</span>

            <svg
              class="h-4 w-4 group-open:hidden"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>

            <svg
              class="hidden h-4 w-4 group-open:block"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </summary>

          <nav
            id="mobile-navigation"
            class="mt-4 border-0 border-t border-solid border-brand-border pt-4"
            aria-label="Основна мобільна навігація"
          >
            <ul class="m-0 flex list-none flex-col gap-2 p-0" role="list">
              <li>
                <a
                  class="flex min-h-11 items-center rounded-lg px-3 py-2 text-sm font-medium text-brand-text no-underline transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none"
                  href="catalog.html"
                  >Кава</a
                >
              </li>

              <li>
                <a
                  class="flex min-h-11 items-center rounded-lg px-3 py-2 text-sm font-medium text-brand-text no-underline transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none"
                  href="quiz.html"
                  >Quiz-підбір</a
                >
              </li>

              <li>
                <a
                  class="flex min-h-11 items-center rounded-lg px-3 py-2 text-sm font-medium text-brand-text no-underline transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none"
                  href="about.html"
                  >Про нас</a
                >
              </li>

              <li>
                <a
                  class="flex min-h-11 items-center rounded-lg px-3 py-2 text-sm font-medium text-brand-text no-underline transition-colors hover:bg-brand-soft focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand motion-reduce:transition-none"
                  href="login.html"
                  >Акаунт</a
                >
              </li>

              <li>
                <a
                  class="inline-flex min-h-12 w-full items-center justify-center gap-2 rounded-lg border border-solid border-brand bg-brand px-3 py-3 text-sm font-semibold leading-5 text-brand-background no-underline transition-colors hover:border-brand-hover hover:bg-brand-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand active:bg-brand-hover motion-reduce:transition-none lg:px-5 lg:text-base lg:leading-5"
                  href="constructor.html"
                  >Створити мікс

                  <svg
                    class="h-4 w-4 shrink-0"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M5 12h14m-6-6 6 6-6 6" /></svg
                ></a>
              </li>
            </ul>
          </nav>
        </details>
      </div>
    </header>
